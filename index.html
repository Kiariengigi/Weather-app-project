<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="/998Asset 1.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=DM+Serif+Display:ital@0;1&family=DM+Serif+Text:ital@0;1&family=Funnel+Display:wght@300..800&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Modak&family=Parkinsans:wght@300..800&family=Pixelify+Sans:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Playwrite+PL:wght@100..400&family=Quicksand:wght@300..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<title>Weather App</title>
</head>
<body>
    <div class="rain">
     <canvas id="c"></canvas>
    </div>
  <div class="w-100 background_img">
    <!-- Top bar -->
    <div class="top_bar container-fluid d-flex justify-content-between align-items-center flex-wrap px-3 px-md-5">
      <h1 id="main_city_text" class="text-white main-city-text raleway-uniquifier m-0"></h1>

      <!-- SEARCH INPUT -->
      <form id="search_bar" class="search_bar input-group mt-3 mt-md-0" role="search">
        <input
          class="form-control rounded-bottom-0 form-control-lg position-relative"
          type="text"
          name="location_selector"
          id="location_box"
          placeholder="Where do you want to go?"
          aria-label="Search location"
          autocomplete="off"
        />
        <button class="btn btn-primary rounded-end-pill" id="location_button" type="submit" aria-label="Search">
          <i class="fa-solid fa-magnifying-glass text-white"></i>
        </button>
        <ul id="autocomplete_list" class="autocomplete_list rounded-bottom-3"></ul>
      </form>
    </div>

    <!-- Weather section -->
    <div class="weather_info container px-3 px-md-4 position-relative align-items-center">
      <!-- Main dashboard -->
       <div class="main_dash_ctrl flex-grow-1">
        <ul id="scrollList" class="d-flex flex-column gap-4">
        </ul>
       </div>
      <!-- Other locations -->
        <div class="other_locations d-flex flex-row justify-content-center align-items-end">
          <!--CONTROLLER FOR THE LOCATION CARDS-->
          <div id="loc_cards" class="location_cards_ctrl d-flex flex-column gap-lg-2">
          </div>
          
      <!-- Pager: horizontal on mobile, vertical on large -->
      <div id="page_selector" class="page_selector text-white align-self-center">
      </div>
    </div>
    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
